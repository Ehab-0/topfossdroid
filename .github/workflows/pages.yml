name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Build and validate catalog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: set -o pipefail; python scripts/build_data.py 2>&1 | tee build.log

      - name: Add build log to summary
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^Traceback' build.log; then
            echo "::error title=Catalog build diagnostic::$(tail -n 1 build.log)"
          fi

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css accessibility.css app.js favicon.svg robots.txt sitemap.xml social-preview.png _site/
          cp -R data icons _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
